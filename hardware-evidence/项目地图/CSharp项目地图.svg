<text class="tx" x="52" y="194">持续同时消费 stdout/stderr，不先 ReadToEnd 再截断</text>
<text class="tx" x="52" y="210">新接口每路保留 1 MiB 原始字节，超限继续消费并标注截断，不依赖行结束</text>
<text class="tx" x="52" y="226">进程退出与日志结束分别收尾，收尾等待有上限（demo 级 UTF-8 双管道已实跑）</text>

