<text class="h2" x="40" y="126">01 C# 七层职责栈（从下到上 L1→L7）</text>
<text class="tm" x="40" y="142">依据：30 完整方案 §5–§15 + HANDOFF · 每层标注条款来源与确认状态 · 两侧不共享内存，靠文件 JSON 交接</text>

<!-- L7 日志 -->
